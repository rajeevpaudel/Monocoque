name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -q

  dbt-build:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dbt-clickhouse
        run: |
          pip install -e .
          pip install dbt-clickhouse

      - name: Apply migrations
        run: python clickhouse/migrate.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .

      # The 28 singular tests and all schema tests previously only ever ran against production
      # data, in Airflow, after merge — a broken join or dialect error (wrong sort key, bad
      # incremental config, etc) would ship before anyone noticed. `dbt build` here runs every
      # model and every test against a freshly-migrated ClickHouse with no ingested data: with
      # 0 rows, not_null/unique/accepted_values/relationships and the singular assertions all
      # trivially hold, but it still fully compiles and executes every model's SQL against real
      # ClickHouse — which catches syntax errors, bad engine/sort-key configs, and missing refs
      # before merge. It does not catch business-logic regressions that only manifest with real
      # data (that's what the Airflow dq_monitor DAG is for) — see docs/data-quality.md.
      - name: dbt build (empty warehouse — schema/compile/test-wiring check)
        working-directory: dbt
        run: dbt build --profiles-dir . --exclude package:elementary
