name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

  # Builds every model and runs every data test against a small real sample
  # (tests/fixtures/warehouse_sample, regenerate with `python scripts/sample_data.py export`).
  dbt-build:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pinned dbt
        run: pip install -e ".[dbt]"

      - name: Apply migrations
        run: python clickhouse/migrate.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: Load sample data
        run: python scripts/sample_data.py load

      - name: dbt seed
        working-directory: dbt
        run: dbt seed --profiles-dir .

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir . --exclude package:elementary
