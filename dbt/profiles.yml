f1_warehouse:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: f1
      secure: false
      # Standard SQL LEFT JOIN semantics: unmatched columns are NULL, not 0 / ''.
      custom_settings:
        join_use_nulls: 1
    elementary:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: elementary
      database: elementary
      secure: false
      # Standard SQL LEFT JOIN semantics: unmatched columns are NULL, not 0 / ''.
      custom_settings:
        join_use_nulls: 1

elementary:
  target: default
  outputs:
    default:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: elementary
      database: elementary
      secure: false
      # Standard SQL LEFT JOIN semantics: unmatched columns are NULL, not 0 / ''.
      custom_settings:
        join_use_nulls: 1
