version: 2

models:
  - name: dim_drivers
    columns:
      - name: driver_id
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null:
              config:
                severity: warn

  - name: dim_circuits
    columns:
      - name: circuit_id
        tests:
          - not_null
          - unique
      - name: length_km
        tests:
          - not_null:
              config:
                severity: warn
      - name: corners
        tests:
          - not_null:
              config:
                severity: warn

  - name: dim_constructors
    columns:
      - name: constructor_id
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null:
              config:
                severity: warn

  - name: dim_sessions
    columns:
      - name: session_key
        tests:
          - not_null
          - unique
      - name: circuit_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_circuits')
                field: circuit_id
              config:
                severity: warn
      - name: race_name
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null

  - name: fact_race_results
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'round', 'driver_id']
    columns:
      - name: race_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_sk
              config:
                severity: warn
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_id
      - name: constructor_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_constructors')
                field: constructor_id
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null
      - name: points
        tests:
          - not_null

  - name: fact_qualifying
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'round', 'driver_id']
    columns:
      - name: race_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_sk
              config:
                severity: warn
      - name: driver_id
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null

  - name: fact_sprint_results
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['season', 'round', 'driver_id']
    columns:
      - name: sprint_format_version
        tests:
          - accepted_values:
              arguments:
                values: ['2021_sets_grid', '2022_2023_standalone', '2024_plus_standalone', 'unknown']
      - name: race_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_sk
              config:
                severity: warn
      - name: driver_id
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null

  - name: fact_pit_stops
    columns:
      - name: race_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_sk
              config:
                severity: warn
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_id
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null
      - name: stop_number
        tests:
          - not_null
      - name: lap_number
        tests:
          - not_null

  - name: fact_laps
    columns:
      - name: race_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_races')
                field: race_sk
              config:
                severity: warn
      - name: driver_id
        tests:
          - not_null
      - name: lap_number
        tests:
          - not_null
      - name: lap_time_ms
        tests:
          - not_null

  - name: mart_lap_telemetry
    columns:
      - name: session_key
        tests:
          - not_null
      - name: driver_number
        tests:
          - not_null
      - name: lap_number
        tests:
          - not_null

  - name: dim_races
    columns:
      - name: race_sk
        tests:
          - not_null
          - unique
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null
      - name: race_name
        tests:
          - not_null
      - name: circuit_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_circuits')
                field: circuit_id
              config:
                severity: warn

  - name: dim_session_drivers
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['session_key', 'driver_number']
    columns:
      - name: session_key
        tests:
          - not_null
      - name: driver_number
        tests:
          - not_null
      - name: driver_code
        tests:
          - not_null:
              config:
                severity: warn

  - name: mart_qualifying_summary
    columns:
      - name: driver_id
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: round
        tests:
          - not_null
      - name: best_source_match
        tests:
          - accepted_values:
              arguments:
                values: ['matched', 'jolpica_only', 'mismatch', 'mismatch_track_limits_deletion']

  - name: fact_race_control
    columns:
      - name: session_key
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - vsc_start
                  - vsc_end
                  - sc_start
                  - sc_end
                  - red_flag_start
                  - red_flag_end
                  - track_limits_deletion
                  - yellow_flag
                  - other
